plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.hs.dongrae.timetable'
    compileSdk 34

    defaultConfig {
        applicationId "kr.hs.dongrae.timetable"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // No heavy dependencies required for ultra-fast native WebView
}
