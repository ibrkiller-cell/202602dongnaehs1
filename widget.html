<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>동래고 교사 시간표 위젯</title>
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon.png">
    <link rel="stylesheet" href="css/widget.css">
    <!-- 위젯 창 크기 강제 고정 스크립트 -->
    <script>
        window.addEventListener('resize', function() {
            try {
                // 브라우저가 허용하는 경우 강제로 원래 크기로 되돌림
                window.resizeTo(360, 620);
            } catch(e) {}
        });
    </script>
</head>
<body>
    <div class="widget-card">
        <!-- Draggable Title Bar -->
        <header class="widget-header">
            <div class="widget-header-title">
                <span class="icon">🏫</span>
                <span>동래고 시간표 위젯</span>
            </div>
            <div class="widget-header-actions">
                <button type="button" class="widget-btn-icon" id="btnWidgetRefresh" title="새로고침">🔄</button>
                <a href="index.html" class="widget-btn-icon" title="전체 시간표 웹앱 열기" target="_blank">🪟</a>
            </div>
        </header>

        <!-- Teacher Selector & Day Switcher -->
        <nav class="widget-nav-bar">
            <select class="widget-teacher-select" id="widgetTeacherSelect" aria-label="교사 선택"></select>
            <div class="widget-day-nav">
                <button type="button" class="widget-day-btn" data-day="월">월</button>
                <button type="button" class="widget-day-btn" data-day="화">화</button>
                <button type="button" class="widget-day-btn" data-day="수">수</button>
                <button type="button" class="widget-day-btn" data-day="목">목</button>
                <button type="button" class="widget-day-btn" data-day="금">금</button>
                <button type="button" class="widget-day-btn today-btn" id="btnWidgetToday" title="오늘 요일로 이동">오늘</button>
            </div>
        </nav>

        <!-- Live Period Tracker Banner -->
        <div class="widget-live-tracker">
            <div style="display: flex; flex-direction: column;">
                <span id="widgetLiveText" style="font-weight: 800; font-size: 0.85rem;">☀️ 오늘의 일과</span>
                <span id="widgetLiveSub" style="font-size: 0.7rem; opacity: 0.9;">실시간 수업 시간 안내</span>
            </div>
            <div class="live-pulse-badge">
                <span class="pulse-dot"></span>
                <span>LIVE</span>
            </div>
        </div>

        <!-- Duty Alerts (Gonggang Jido & Lunch) -->
        <div class="widget-duty-box" id="widgetDutyBox"></div>

        <!-- 1~7 Period List -->
        <main class="widget-period-list" id="widgetPeriodList">
            <div style="text-align: center; padding: 2rem; color: #94a3b8; font-size: 0.825rem;">
                시간표 데이터를 불러오는 중...
            </div>
        </main>

        <!-- Footer -->
        <footer class="widget-footer">
            <span id="widgetDateLabel" style="font-weight: 700; color: var(--text-muted);">2026-2학기</span>
            <a href="index.html" class="widget-btn-full" target="_blank">
                <span>📅</span> <span>전체 시간표 열기</span>
            </a>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="js/default-data.js"></script>
    <script src="js/academic-calendar.js"></script>
    <script src="js/lunch-guidance.js"></script>
    <script src="js/gonggang-jido.js"></script>
    <script src="js/timetable-engine.js"></script>
    <script src="js/widget.js"></script>
</body>
</html>
